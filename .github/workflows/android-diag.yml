name: Android diagnostics

# One emulator per variant: opens the main list with parts of the city cards left out ("off"),
# takes one screenshot and publishes it with the log to ci-android-diag-<key>. Run by hand or on a
# change to this file.
on:
  push:
    branches: [main]
    paths: [".github/workflows/android-diag.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: empty, off: "footer,photos,capsule,tiles,pills,time,texts,scrim" }
          - { key: tiles, off: "footer,photos,capsule,pills,time,texts,scrim" }
          - { key: pills, off: "footer,photos,capsule,tiles,time,texts,scrim" }
          - { key: time, off: "footer,photos,capsule,tiles,pills,texts,scrim" }
          - { key: texts, off: "footer,photos,capsule,tiles,pills,time,scrim" }
          - { key: scrim, off: "footer,photos,capsule,tiles,pills,time,texts" }
          - { key: photos, off: "footer,capsule,tiles,pills,time,texts,scrim" }
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build
        run: |
          mkdir -p "$OUT"
          gradle -p android assembleDebug --no-daemon 2>&1 | tail -5
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Main list with parts off
        timeout-minutes: 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk > "$OUT/install.txt" 2>&1
            adb logcat -c; (adb logcat -v time > "$OUT/logcat.txt" 2>&1 &)
            adb shell am start -n com.bradcowdrey.meridian/.MainActivity --ez screenshots true --es screen main --es off "${{ matrix.off }}" > "$OUT/launch.txt" 2>&1
            sleep 15
            timeout 60 adb exec-out screencap -p > "$OUT/main.png" || true
            echo "screenshot $(stat -c %s "$OUT/main.png") bytes; device: $(timeout 10 adb get-state 2>&1)" >> "$OUT/launch.txt"
      - name: Publish
        if: always()
        run: |
          cd "$OUT"
          echo "${{ matrix.off }}" > off.txt; echo "$GITHUB_SHA" > commit.txt
          git init -q -b b; git config user.name ci; git config user.email ci@users.noreply.github.com
          git add -A && git commit -qm "Android diag ${{ matrix.key }} for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" b:ci-android-diag-${{ matrix.key }}
