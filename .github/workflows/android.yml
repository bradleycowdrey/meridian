name: Android app

# Builds the Android app (android/), runs it on an emulator, takes a screenshot of every screen
# and publishes them, with the debug APK, to the ci-android branch.
# The APK link on bradcowdrey.com/meridian points at ci-android/Meridian-debug.apk (the debug build).
#
# The release job builds the release App Bundle and APK, signed with the upload key when the ANDROID_KEYSTORE_*
# secrets are set, and keeps them as the run's artifact (meridian-release-<version>-<code>). Builds for testers go to
# Google Play's closed test (docs/play/README.md): a new Meridian release (release.yml starts this workflow on the new
# v<VERSION> tag, and a v* tag pushed by hand starts it too) and runs started by hand (Actions, Run workflow).
# Pushes to main never go to Play. The version code is the commit count, so each later commit on main gets a higher one.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    # Not for release tags: ci-android (the website's APK) always follows main.
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      # Android 16 (API level 36), which the app compiles against and targets.
      - name: Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null \
            || echo "::warning::sdkmanager couldn't install platforms;android-36; Gradle will try"
      - name: Build
        id: build
        run: |
          mkdir -p "$OUT"
          set -o pipefail
          gradle -p android assembleDebug -PversionCode="$(git rev-list --count HEAD)" --no-daemon --stacktrace 2>&1 | tee "$OUT/build.log" | grep -E "^e: |error:|FAILED|BUILD" || true
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/Meridian-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots (emulator)
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          script: bash android/screenshots.sh "$OUT/screenshots"
      - name: Check the city cards show photos
        run: |
          pip install --quiet pillow
          python3 - "$OUT/screenshots/screen-main.png" <<'EOF'
          import sys
          from PIL import Image, ImageStat
          im = Image.open(sys.argv[1]).convert("L")
          w, h = im.size
          # The sky of the first two cards (top right, above the tiles): a photo or the drawn skyline has texture; a blank card is flat.
          boxes = [(int(w * .74), int(h * .175), int(w * .95), int(h * .215)), (int(w * .74), int(h * .33), int(w * .95), int(h * .37))]
          spreads = [ImageStat.Stat(im.crop(b)).stddev[0] for b in boxes]
          print("card sky spread:", [round(x, 1) for x in spreads])
          sys.exit(0 if max(spreads) >= 6 else "city cards look blank (no photo or drawn skyline)")
          EOF
      # Only after a good build, so a failed build never replaces the website's Meridian-debug.apk. After a failed
      # emulator run the logs and screenshots are published, but the APK stays the last good build's.
      - name: Publish to ci-android branch
        if: always() && steps.build.outcome == 'success'
        run: |
          cd "$OUT"
          echo "$GITHUB_SHA" > commit.txt
          if [ "${{ job.status }}" != success ]; then
            rm -f Meridian-debug.apk
            git clone -q --depth 1 -b ci-android "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" "$RUNNER_TEMP/last" \
              && cp "$RUNNER_TEMP/last/Meridian-debug.apk" . \
              && { cp "$RUNNER_TEMP/last/apk-commit.txt" . 2>/dev/null || cp "$RUNNER_TEMP/last/commit.txt" apk-commit.txt; }
            echo "::warning::The emulator run failed: ci-android keeps the APK of the last good build ($(cat apk-commit.txt 2>/dev/null))"
          fi
          test -s Meridian-debug.apk
          git init -q -b ci-android
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Android build for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-android

  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      HAS_SIGNING: ${{ secrets.ANDROID_KEYSTORE_B64 != '' || secrets.ANDROID_KEYSTORE != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
      REL: ${{ github.workspace }}/release
    steps:
      # The whole history, so the commit count (the version code) is right.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Work out the version
        run: |
          # versionCode: the commit count, as for the debug build. versionName: the release's version (v2.1.6 -> 2.1.6),
          # or VERSION for a run started by hand.
          echo "VERSION_CODE=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then V="${GITHUB_REF_NAME#v}"; else V="$(tr -d '[:space:]' < VERSION)"; fi
          echo "VERSION_NAME=$V" >> "$GITHUB_ENV"
          # For testers: a release tag or a run started by hand, of a commit on main (so a build from another branch
          # never takes a version code main will need).
          FOR_TESTERS=false
          if [[ "$GITHUB_REF_TYPE" == "tag" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            if git merge-base --is-ancestor HEAD origin/main; then FOR_TESTERS=true; else echo "::notice::Not a commit on main: not sent to Google Play"; fi
          fi
          echo "FOR_TESTERS=$FOR_TESTERS" >> "$GITHUB_ENV"
          # What's new: this version's section of CHANGELOG.md, without the lines about the Mac (Play keeps 500 characters).
          { echo "RELEASE_NOTES<<NOTES_EOF"
            awk -v v="$V" '/^## /{p = (index($0, "## " v " ") == 1); next} p' CHANGELOG.md | grep -v -E '\b(Mac|macOS)\b' | sed -e 's/\*\*//g' -e '/^[[:space:]]*$/d' || true
            echo "NOTES_EOF"; } >> "$GITHUB_ENV"
          echo "Meridian $V ($(git rev-list --count HEAD)), for testers: $FOR_TESTERS"
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.13" }
      # Android 16 (API level 36), which the app compiles against and targets.
      - name: Android SDK platform 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" > /dev/null \
            || echo "::warning::sdkmanager couldn't install platforms;android-36; Gradle will try"
      - name: Build the release (App Bundle and APK)
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          mkdir -p "$REL"
          if [ "$HAS_SIGNING" = true ]; then
            # The upload key, from the secret (base64 .jks), only for this build.
            export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/upload.jks"
            trap 'rm -f "$ANDROID_KEYSTORE_FILE"' EXIT
            printf '%s' "${ANDROID_KEYSTORE_B64:-$ANDROID_KEYSTORE}" | tr -d '[:space:]' | base64 -d > "$ANDROID_KEYSTORE_FILE"
            export ANDROID_KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          else
            echo "::notice::No ANDROID_KEYSTORE_B64 secret: the release build is unsigned (a check only), and nothing goes to Google Play"
          fi
          set -o pipefail
          gradle -p android bundleRelease assembleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME" --no-daemon --stacktrace 2>&1 | tee "$REL/build.log" | grep -E "^e: |error:|FAILED|BUILD" || true
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB"
          if [ "$HAS_SIGNING" = true ]; then
            # Signed with the upload key, or stop here.
            CHECK=$(jarsigner -verify "$AAB" 2>&1 || true)
            grep -q "jar verified" <<< "$CHECK" || { echo "::error::The App Bundle isn't signed: $CHECK"; exit 1; }
            cp "$AAB" "$REL/Meridian-$VERSION_NAME.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "$REL/Meridian-$VERSION_NAME.apk"
            echo "::notice::Meridian $VERSION_NAME ($VERSION_CODE) signed with the upload key: the artifact meridian-release-$VERSION_NAME-$VERSION_CODE has the .aab and .apk"
          fi
      - name: Keep the signed App Bundle and APK
        if: env.HAS_SIGNING == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: meridian-release-${{ env.VERSION_NAME }}-${{ env.VERSION_CODE }}
          path: |
            release/*.aab
            release/*.apk
          retention-days: 90
      - name: Google Play closed test
        if: env.HAS_PLAY == 'true' && env.HAS_SIGNING == 'true' && env.FOR_TESTERS == 'true'
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          PLAY_PACKAGE: com.bradcowdrey.meridian
          PLAY_AAB: release/Meridian-${{ env.VERSION_NAME }}.aab
          PLAY_RELEASE_NAME: ${{ env.VERSION_NAME }} (${{ env.VERSION_CODE }})
          PLAY_RELEASE_NOTES: ${{ env.RELEASE_NOTES }}
        run: |
          pip install --quiet pyjwt cryptography
          python3 .github/scripts/play_publish.py
