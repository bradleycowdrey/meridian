name: Android app

# Builds the Android app (android/), runs it on an emulator, takes a screenshot of every screen
# and publishes them, with the debug APK, to the ci-android branch.
# The APK link on bradcowdrey.com/meridian points at ci-android/Meridian-debug.apk.
on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - name: Build
        run: |
          mkdir -p "$OUT"
          set -o pipefail
          gradle -p android assembleDebug -PversionCode="$(git rev-list --count HEAD)" --no-daemon --stacktrace 2>&1 | tee "$OUT/build.log" | grep -E "^e: |error:|FAILED|BUILD" || true
          test -f android/app/build/outputs/apk/debug/app-debug.apk
          cp android/app/build/outputs/apk/debug/app-debug.apk "$OUT/Meridian-debug.apk"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Screenshots (emulator)
        timeout-minutes: 25
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          ram-size: 4096M
          heap-size: 576M
          disk-size: 6000M
          script: bash android/screenshots.sh "$OUT/screenshots"
      - name: Check the city cards show photos
        run: |
          pip install --quiet pillow
          python3 - "$OUT/screenshots/screen-main.png" <<'EOF'
          import sys
          from PIL import Image, ImageStat
          im = Image.open(sys.argv[1]).convert("L")
          w, h = im.size
          # The sky of the first two cards (top right, above the tiles): a photo or the drawn skyline has texture; a blank card is flat.
          boxes = [(int(w * .74), int(h * .175), int(w * .95), int(h * .215)), (int(w * .74), int(h * .33), int(w * .95), int(h * .37))]
          spreads = [ImageStat.Stat(im.crop(b)).stddev[0] for b in boxes]
          print("card sky spread:", [round(x, 1) for x in spreads])
          sys.exit(0 if max(spreads) >= 6 else "city cards look blank (no photo or drawn skyline)")
          EOF
      - name: Publish to ci-android branch
        if: always()
        run: |
          cd "$OUT"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-android
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Android build for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-android
