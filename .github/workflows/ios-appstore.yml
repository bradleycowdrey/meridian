name: iPhone App Store

# App Store screenshots and listing for the iPhone app, and (when ios/APPSTORE changes) the App Store build.
#   Push to main (iPhone files): takes the App Store screenshots (6.9-inch iPhone) and publishes them,
#     with the listing text, to the ci-appstore branch for review. Nothing goes to Apple.
#   ios/APPSTORE changed to "1.0.0 submit": also builds, signs (Apple Distribution certificate, with
#     App Store profiles fetched through the App Store Connect API key),
#     uploads the build, screenshots and listing, and submits for review.
#   ios/APPSTORE changed to "1.0.0 test": the same, without submitting for review.
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (the .p8 file's contents, Admin role),
#          IOS_DIST_P12, IOS_DIST_P12_PASSWORD (Apple Distribution certificate, base64 .p12),
#          APP_REVIEW_EMAIL, APP_REVIEW_PHONE (optional; ios/fastlane/metadata/review_information has them).
on:
  push:
    branches: [main]
    paths: ["ios/**", "Widget/**", "Sources/Meridian/Shared/**", "Sources/Meridian/Model/Place.swift",
            "Sources/Meridian/Model/CityDirectory.swift", ".github/workflows/ios-appstore.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-appstore-${{ github.ref }}
  cancel-in-progress: false

jobs:
  appstore:
    runs-on: macos-15
    timeout-minutes: 120
    env:
      OUT: ${{ github.workspace }}/out
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Release requested? (ios/APPSTORE changed in this push)
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          read -r V MODE < ios/APPSTORE || true
          if [ -n "$BEFORE" ] && ! git diff --quiet "$BEFORE" HEAD -- ios/APPSTORE 2>/dev/null && [[ "$MODE" == test || "$MODE" == submit ]]; then
            echo "IS_TAG=true" >> "$GITHUB_ENV"; echo "VERSION=$V" >> "$GITHUB_ENV"
            [[ "$MODE" == submit ]] && echo "SUBMIT=true" >> "$GITHUB_ENV" || echo "SUBMIT=false" >> "$GITHUB_ENV"
            echo "App Store build: $V ($MODE)"
          else
            echo "IS_TAG=false" >> "$GITHUB_ENV"; echo "Screenshots only"
          fi
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen && mkdir -p "$OUT"

      - name: Screenshots (6.9-inch iPhone)
        run: |
          set +e
          SHOTS=ios/fastlane/screenshots/en-US; mkdir -p "$SHOTS" "$OUT/screenshots"
          set -o pipefail
          xcodebuild -project ios/Meridian.xcodeproj -scheme Meridian -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$OUT/simulator-build.log" | grep -E "error:|BUILD"
          APP=build/Build/Products/Debug-iphonesimulator/Meridian.app; ID=com.bradcowdrey.meridian
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16 Pro Max (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device: $(xcrun simctl list devices | grep "$DEVICE")" > "$OUT/device.txt"
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" "$APP"
          n=1
          for screen in main travel widgets date add; do
            xcrun simctl terminate "$DEVICE" $ID 2>/dev/null
            SIMCTL_CHILD_TZ=America/Los_Angeles xcrun simctl launch "$DEVICE" $ID -screenshots -screen $screen >> "$OUT/launch.txt" 2>&1
            sleep 7
            xcrun simctl io "$DEVICE" screenshot "$SHOTS/0${n}-$screen.png"
            n=$((n + 1))
          done
          cp "$SHOTS"/*.png "$OUT/screenshots/"
          # QA only (not for the store): the main screen at a large accessibility text size.
          xcrun simctl ui "$DEVICE" content_size accessibility-large
          xcrun simctl terminate "$DEVICE" $ID 2>/dev/null
          SIMCTL_CHILD_TZ=America/Los_Angeles xcrun simctl launch "$DEVICE" $ID -screenshots -screen main >> "$OUT/launch.txt" 2>&1
          sleep 7; xcrun simctl io "$DEVICE" screenshot "$OUT/qa-large-text.png"
          xcrun simctl ui "$DEVICE" content_size large
          sips -g pixelWidth -g pixelHeight "$SHOTS"/*.png > "$OUT/screenshot-sizes.txt"
          ls "$SHOTS"/*.png | wc -l | grep -q 5

      - name: Check App Store secrets
        if: env.IS_TAG == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          IOS_DIST_P12: ${{ secrets.IOS_DIST_P12 }}
          IOS_DIST_P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
        run: |
          missing=""
          for s in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 IOS_DIST_P12 IOS_DIST_P12_PASSWORD; do [ -z "${!s}" ] && missing="$missing $s"; done
          if [ -n "$missing" ]; then echo "Missing secrets:$missing" | tee "$OUT/release.txt"; exit 1; fi

      - name: Import the Apple Distribution certificate
        if: env.IS_TAG == 'true'
        env:
          P12: ${{ secrets.IOS_DIST_P12 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          CERT_KIND: Apple Distribution
        run: scripts/import-signing-cert.sh 2>&1 | tee "$OUT/certificate.txt"

      - name: Build and sign (App Store profiles)
        if: env.IS_TAG == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          brew install fastlane >/dev/null; export PATH="$(brew --prefix)/bin:$PATH"; fastlane --version | tail -1
          BUILD="$(git rev-list --count HEAD)"; echo "BUILD=$BUILD" >> "$GITHUB_ENV"
          cd ios
          python3 -c 'import json, os; json.dump({"key_id": os.environ["ASC_KEY_ID"], "issuer_id": os.environ["ASC_ISSUER_ID"], "key": os.environ["ASC_KEY_P8"], "in_house": False}, open("fastlane/api_key.json", "w"))'
          set -o pipefail
          fastlane build version:"$VERSION" build:"$BUILD" out:"$RUNNER_TEMP/export" 2>&1 \
            | grep -v -i -E "BEGIN PRIVATE|issuer_id|key_id" | tee "$OUT/build.log"
          IPA="$RUNNER_TEMP/export/Meridian.ipa"; echo "IPA=$IPA" >> "$GITHUB_ENV"
          # What the App Store will see: signer and entitlements of the app and the widget.
          cd "$RUNNER_TEMP" && rm -rf check && mkdir check && cd check && unzip -q "$IPA"
          for b in Payload/Meridian.app Payload/Meridian.app/PlugIns/MeridianWidget.appex; do
            echo "== $b"; codesign -dvv "$b" 2>&1 | grep -E "Authority|TeamIdentifier|Identifier="
            codesign -d --entitlements - --xml "$b" 2>/dev/null | plutil -p - 2>/dev/null
          done | tee "$OUT/signature.txt"
          grep -q "group.com.bradcowdrey.meridian" "$OUT/signature.txt"

      - name: Upload to App Store Connect
        if: env.IS_TAG == 'true'
        env:
          APP_REVIEW_EMAIL: ${{ secrets.APP_REVIEW_EMAIL }}
          APP_REVIEW_PHONE: ${{ secrets.APP_REVIEW_PHONE }}
        run: |
          export PATH="$(brew --prefix)/bin:$PATH"
          cd ios
          python3 - <<'PY'
          import os
          for name in ("email_address", "phone_number"):
              value = os.environ.get("APP_REVIEW_" + name.split("_")[0].upper(), "")
              path = f"fastlane/metadata/review_information/{name}.txt"
              if value and not os.path.exists(path):   # the committed contact details win
                  open(path, "w").write(value)
          PY
          set -o pipefail
          fastlane upload version:"$VERSION" ipa:"$IPA" submit:"$SUBMIT" 2>&1 \
            | grep -v -i -E "BEGIN PRIVATE|issuer_id|key_id|phone|email" | tee "$OUT/fastlane.log"
          rm -f fastlane/api_key.json

      - name: Publish to ci-appstore branch
        if: always()
        run: |
          rm -f ios/fastlane/api_key.json
          cp -R ios/fastlane/metadata "$OUT/metadata"
          cd "$OUT"
          echo "$GITHUB_SHA $GITHUB_REF_NAME release=$IS_TAG ${VERSION:-} submit=${SUBMIT:-}" > commit.txt
          git init -q -b ci-appstore
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "App Store run for $GITHUB_REF_NAME $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-appstore
