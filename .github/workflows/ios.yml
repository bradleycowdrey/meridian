name: iPhone app

# Builds the iPhone app and its widgets for the Simulator, takes a screenshot of every screen
# and renders every widget, and publishes them to the ci-ios branch.
on:
  push:
    branches: [main]
    paths: ["ios/**", "Widget/**", "Sources/Meridian/Shared/**", "Sources/Meridian/Model/**", "Resources/**",
            "scripts/build-ipa.sh", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  simulator:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: brew install xcodegen && cd ios && xcodegen
      - name: Build for the Simulator
        run: |
          OUT="$RUNNER_TEMP/ios"; mkdir -p "$OUT"
          set -o pipefail
          xcodebuild -project ios/Meridian.xcodeproj -scheme Meridian -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee "$OUT/build.log" | grep -E "error:|warning: .*Meridian|BUILD" || true
          test -d build/Build/Products/Debug-iphonesimulator/Meridian.app
      - name: Screenshots
        if: always()
        run: |
          set +e
          OUT="$RUNNER_TEMP/ios"; mkdir -p "$OUT"
          APP=build/Build/Products/Debug-iphonesimulator/Meridian.app
          ID=com.bradcowdrey.meridian
          DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone 16 Pro (" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          [ -z "$DEVICE" ] && DEVICE=$(xcrun simctl list devices available | grep -m1 "iPhone" | sed -E 's/.*\(([0-9A-F-]{36})\).*/\1/')
          echo "device: $(xcrun simctl list devices | grep $DEVICE)" > "$OUT/device.txt"
          xcrun simctl boot "$DEVICE"; xcrun simctl bootstatus "$DEVICE" -b
          xcrun simctl ui "$DEVICE" appearance dark
          xcrun simctl status_bar "$DEVICE" override --time "9:41" --batteryState charged --batteryLevel 100 --cellularBars 4 --wifiBars 3
          xcrun simctl install "$DEVICE" "$APP" || echo "install failed" >> "$OUT/device.txt"
          # Mean luminance of rows 300-2400 (below the status bar, above the home indicator); 99 if
          # Pillow is missing, so a missing tool never triggers a retry or fails the job.
          python3 -m pip install --quiet --user --break-system-packages pillow >/dev/null 2>&1 || python3 -m pip install --quiet --user pillow >/dev/null 2>&1
          mean() { python3 -c 'import sys
          try:
              from PIL import Image
          except Exception:
              print(99); sys.exit()
          im = Image.open(sys.argv[1]).convert("L"); w, h = im.size
          px = im.crop((0, min(300, h), w, min(2400, h))).getdata()
          print(int(sum(px) / max(1, len(px))))' "$1" 2>/dev/null || echo 99; }
          # Warm-up: the first, cold launch after install can sit on the bare launch surface past the
          # sleep (the black Terms capture in c10), so take that launch here, off the record.
          xcrun simctl launch "$DEVICE" $ID -screenshots -screen main >> "$OUT/launch.txt" 2>&1
          sleep 8
          xcrun simctl terminate "$DEVICE" $ID 2>/dev/null
          for screen in terms main travel edit add settings date find; do
            xcrun simctl terminate "$DEVICE" $ID 2>/dev/null
            xcrun simctl launch "$DEVICE" $ID -screenshots -screen $screen -render-widgets >> "$OUT/launch.txt" 2>&1
            if [ "$screen" = terms ]; then sleep 10; else sleep 6; fi
            xcrun simctl io "$DEVICE" screenshot "$OUT/screen-$screen.png"
            M=$(mean "$OUT/screen-$screen.png")
            if [ "${M:-99}" -lt 5 ]; then
              echo "$screen: mean $M, retaking" >> "$OUT/device.txt"
              sleep 6
              xcrun simctl io "$DEVICE" screenshot "$OUT/screen-$screen.png"
            fi
            echo "$screen mean $(mean "$OUT/screen-$screen.png")" >> "$OUT/device.txt"
          done
          TERMS_MEAN=$(mean "$OUT/screen-terms.png")
          DATA=$(xcrun simctl get_app_container "$DEVICE" $ID data)
          cp -R "$DATA/Documents/widgets" "$OUT/" 2>/dev/null || echo "no widget renders" >> "$OUT/device.txt"
          # Crash reports, if any.
          ls ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i meridian >> "$OUT/device.txt"
          # Fail (after the renders are copied; the publish step still runs) if Terms is still black.
          if [ "${TERMS_MEAN:-99}" -lt 3 ]; then echo "screen-terms.png is black (mean $TERMS_MEAN)"; exit 1; fi
      # Ad-hoc signed device build for sideloading (AltStore / Sideloadly re-sign it; docs/sideload.md).
      # Published with the screenshots, so https://github.com/bradleycowdrey/meridian/raw/ci-ios/Meridian-iOS.ipa
      # is always the newest build. Never fails the job.
      - name: Sideload build (Meridian-iOS.ipa)
        if: always()
        continue-on-error: true
        run: |
          OUT="$RUNNER_TEMP/ios"; mkdir -p "$OUT"
          set -o pipefail
          scripts/build-ipa.sh "$OUT/Meridian-iOS.ipa" 2>&1 | tee "$OUT/ipa-build.log" | grep -E "error:|BUILD|Meridian-iOS.ipa"
      - name: Publish to ci-ios branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/ios"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-ios
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "iPhone build for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-ios
