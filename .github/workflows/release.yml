name: Release

# Every push to main builds the app and publishes the DMG on GitHub Releases as v<VERSION>,
# plus a stable Meridian.dmg so https://github.com/bradleycowdrey/meridian/releases/latest/download/Meridian.dmg
# always serves the newest build. Bump VERSION for a new release; pushing again with the same
# VERSION replaces that release's files.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

# One release run per commit, even if a branch push and a tag push arrive together.
concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      HAS_SIGNING_CERT: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Optional: Developer ID signing + notarization removes the Gatekeeper warning.
      # Add these repository secrets to enable it; without them the app is ad-hoc signed.
      - name: Import signing certificate
        if: env.HAS_SIGNING_CERT == 'true'
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          CODESIGN_IDENTITY: ${{ secrets.CODESIGN_IDENTITY }}
        run: scripts/import-signing-cert.sh

      - name: Work out version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "TAG=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
          else
            echo "TAG=v$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          fi

      - name: Build and package
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: |
          set -o pipefail
          { scripts/build-app.sh "$TAG" && scripts/make-dmg.sh "$TAG"; } 2>&1 | tee "$RUNNER_TEMP/release.log"
          cp dist/Meridian-*.dmg dist/Meridian.dmg

      # The iPhone app as an ad-hoc signed .ipa for sideloading until it's on the App Store
      # (docs/sideload.md), so releases/latest/download/Meridian-iOS.ipa works. Never blocks the Mac release.
      - name: Build the iPhone app for sideloading
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only an existing release without the .ipa (or a new one) would use it; skip otherwise.
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' 2>/dev/null | grep -qx Meridian-iOS.ipa; then echo "Release $TAG already has the ipa"; exit 0; fi
          set -o pipefail
          scripts/build-ipa.sh dist/Meridian-iOS.ipa 2>&1 | tee "$RUNNER_TEMP/ipa-build.log" | grep -E "error:|BUILD|Meridian-iOS.ipa"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Never replace a published version's files; bump VERSION to release new code.
            echo "Release $TAG already exists; not overwriting it."
            # Only exception: add the iPhone sideload build if this release doesn't have one yet.
            if [ -f dist/Meridian-iOS.ipa ] && ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets[].name' | grep -qx Meridian-iOS.ipa; then
              gh release upload "$TAG" dist/Meridian-iOS.ipa --repo "$GITHUB_REPOSITORY"
            fi
          else
            # Pre-release tags (v1.0.0-beta) never become "latest" for everyone.
            if [[ "$TAG" == *-* ]]; then KIND=--prerelease; else KIND=--latest; fi
            # Notes: this version's section of CHANGELOG.md, then the install line.
            V="${TAG##*v}"
            awk -v v="$V" '/^## /{p = (index($0, "## " v " ") == 1)} p' CHANGELOG.md | sed '1d' > notes.md
            printf '\n**Install:** download the DMG, open it and drag Meridian into Applications. Already installed? Meridian updates itself.\n\n**iPhone (sideload until it is on the App Store):** Meridian-iOS.ipa, installed with AltStore or Sideloadly. Steps: https://github.com/bradleycowdrey/meridian/blob/main/docs/sideload.md\n\nMade by Bradley Cowdrey · bradcowdrey.com\n' >> notes.md
            IPA=(); [ -f dist/Meridian-iOS.ipa ] && IPA=(dist/Meridian-iOS.ipa)
            gh release create "$TAG" dist/*.dmg dist/*.sha256 "${IPA[@]}" \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" $KIND \
              --title "Meridian $V" \
              --notes-file notes.md
          fi

      # The release log (including Apple's notarization report) on the ci-release branch,
      # readable without access to the Actions page.
      - name: Publish release log
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/rel" && cd "$RUNNER_TEMP/rel"
          cp "$RUNNER_TEMP/release.log" . 2>/dev/null || echo "no log" > release.log
          cp "$RUNNER_TEMP/ipa-build.log" . 2>/dev/null || true
          echo "$GITHUB_SHA ${{ job.status }}" > commit.txt
          git init -q -b ci-release
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Release log for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-release
