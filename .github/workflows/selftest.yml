name: Layout self-test

# Builds the app on a real Mac, runs `Meridian --selftest`, and publishes the report and
# screenshots to the ci-shots branch.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  selftest:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          set -o pipefail
          scripts/build-app.sh 0.0.0-selftest 2>&1 | tee "$OUT/build.log"
      - name: Run layout self-test
        run: |
          OUT="$RUNNER_TEMP/shots"; mkdir -p "$OUT"
          dist/Meridian.app/Contents/MacOS/Meridian --selftest "$OUT" > "$OUT/app.log" 2>&1 &
          PID=$!
          for i in $(seq 1 600); do [ -f "$OUT/report.txt" ] && break; sleep 1; done
          sleep 1; kill $PID 2>/dev/null || true
          system_profiler SPDisplaysDataType | grep -iE "resolution|ui looks like" > "$OUT/display.txt" || true
          cat "$OUT/report.txt" 2>/dev/null || echo "no report"
      - name: Check widget registration
        run: |
          OUT="$RUNNER_TEMP/shots"
          ditto dist/Meridian.app /Applications/Meridian.app
          /System/Library/Frameworks/CoreServices.framework/Frameworks/LaunchServices.framework/Support/lsregister -f -R /Applications/Meridian.app
          pluginkit -a /Applications/Meridian.app/Contents/PlugIns/MeridianWidget.appex || true
          sleep 5
          {
            echo "== entitlements"; codesign -d --entitlements - /Applications/Meridian.app/Contents/PlugIns/MeridianWidget.appex 2>&1
            echo "== verify"; codesign --verify --deep --strict --verbose=2 /Applications/Meridian.app 2>&1
            echo "== pluginkit"; pluginkit -mAvvv -p com.apple.widgetkit-extension 2>&1 | grep -i -B2 -A8 comridian || echo "not registered"
          } > "$OUT/widget.txt"
          cat "$OUT/widget.txt"
      - name: Widget diagnostics
        if: always()
        run: |
          set +e   # several checks below exit non-zero by design; capture everything
          OUT="$RUNNER_TEMP/shots"; D="$OUT/widget-diag.txt"
          APPEX=/Applications/Meridian.app/Contents/PlugIns/MeridianWidget.appex
          START=$(date '+%Y-%m-%d %H:%M:%S')
          open /Applications/Meridian.app; sleep 10
          # Make the widget host rescan extensions, as it does after login.
          killall chronod 2>/dev/null || true; sleep 15
          {
            echo "== codesign"; codesign -dvvv "$APPEX" 2>&1
            echo "== entitlements"; codesign -d --entitlements - "$APPEX" 2>&1
            echo "== spctl"; spctl -a -vvv -t execute /Applications/Meridian.app 2>&1
            echo "== pluginkit"; pluginkit -mAvvv -i me.bradcowdrey.comridian.widget 2>&1
            echo "== Info.plist"; plutil -p "$APPEX/Contents/Info.plist" 2>&1
            echo "== binary"; file "$APPEX/Contents/MacOS/MeridianWidget"; otool -L "$APPEX/Contents/MacOS/MeridianWidget" | head -20
            echo "== run directly (expect it to complain it wasn't started by the system)"
            ( "$APPEX/Contents/MacOS/MeridianWidget" & P=$!; sleep 4; kill $P 2>/dev/null ) 2>&1 | head -20
            echo "== log mentioning the widget"
            log show --start "$START" --style compact --predicate 'eventMessage CONTAINS[c] "comridian" OR eventMessage CONTAINS[c] "MeridianWidget" OR process == "MeridianWidget"' 2>&1 | tail -200
            echo "== chronod errors"
            log show --start "$START" --style compact --predicate 'process == "chronod" AND (messageType == error OR messageType == fault)' 2>&1 | tail -80
            echo "== crash reports"; ls -la ~/Library/Logs/DiagnosticReports 2>/dev/null | grep -i meridian
          } > "$D" 2>&1
          tail -60 "$D"
      - name: Publish to ci-shots branch
        if: always()
        run: |
          cd "$RUNNER_TEMP/shots"
          echo "$GITHUB_SHA" > commit.txt
          git init -q -b ci-shots
          git config user.name "ci"; git config user.email "ci@users.noreply.github.com"
          git add -A && git commit -qm "Layout self-test for $GITHUB_SHA"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shots
      - name: Require widget registration and passing functional checks
        run: |
          OUT="$RUNNER_TEMP/shots"
          grep -q "comridian.widget" "$OUT/widget.txt" || { echo "::error::widget extension not registered"; exit 1; }
          if grep -q "^FAIL" "$OUT/functional.txt"; then grep "^FAIL" "$OUT/functional.txt"; exit 1; fi
